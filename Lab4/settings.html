<!DOCTYPE html>
<html lang="uk">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<title>Settings</title>
<link rel="stylesheet" href="style.css">
</head>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> <link rel="stylesheet" href="style.css"> </head>
<body>

    <div class="container">
        <header class="page-header">
            <p class="breadcrumbs">Home / Setting Name</p>
            <div class="header-actions">
                <button class="btn">Discard</button>
                <button class="btn">Save</button>
                <button class="btn btn-primary"><a href="formula.html">Create Formula</a></button>
            </div>
        </header>

        <main>
            <section class="card">
                <label for="setting-title" class="input-label">Title</label>
                <input type="text" id="setting-title" class="input" placeholder="Setting Name">
            </section>

            <section class="card text-center">
                <img src="oopsie.png" alt="Empty state icon" class="empty-state-icon">
                <p class="text-muted">Oopsie, seems that you have no formulas yet</p>
                <button class="add-button"><a href="formula.html">+</a></button>
                <p class="small-text">Create your first formula!</p>
            </section>

            <section class="card">
                <h2 class="card-title">Formulas</h2>
                <div class="list">
                    <div class="list-item">
                        <span>BTC increase each 2 sec for T-Shirts</span>
                        <div class="item-actions">
                            <button class="icon-btn">✏️</button>
                            <button class="icon-btn">🗑️</button>
                        </div>
                    </div>
                    <div class="list-item">
                        <span>BTC increase each 2 sec for T-Shirts</span>
                        <div class="item-actions">
                            <button class="icon-btn">✏️</button>
                            <button class="icon-btn">🗑️</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
