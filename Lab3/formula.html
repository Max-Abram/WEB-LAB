<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <nav class="breadcrumbs">
                <a href="#">settings</a> / <a href="#">setting-name</a> / <a href="#" class="active">formula-name</a>
            </nav>
            <div class="header-actions">
                <button class="btn">Discard</button>
                <button class="btn btn-primary" disabled>Save</button>
            </div>
        </header>

        <main class="grid-layout">
            <div class="grid-column">
                <section class="card">
                    <div class="card-header">
                        <h2 class="card-title">Formula settings</h2>
                        <span class="info-icon">ⓘ</span>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Formula</label>
                        <input type="text" class="input" value="X * Y">
                        <p class="input-hint">X - cryptocurrency price, Y - product price</p>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Frequency</label>
                        <input type="text" class="input" value="1000">
                        <p class="input-hint">In milliseconds (like 1000ms == 1s)</p>
                    </div>
                    <div class="input-group">
                        <input type="search" class="input" placeholder="🔍 Search">
                        <p class="input-hint">Select crypto from the list or search.</p>
                    </div>
                    <div class="list">
                        <a href="#" class="list-item active">Bitcoin</a>
                        <a href="#" class="list-item">Ethereum</a>
                        <a href="#" class="list-item">Ripple</a>
                        <a href="#" class="list-item">Litecoin</a>
                    </div>
                    <button class="btn btn-primary full-width">Save</button>
                </section>
            </div>

            <div class="grid-column">
                <section class="card">
                    <div class="card-header">
                        <h2 class="card-title">Add collections</h2>
                        <span class="arrow-icon up"></span>
                    </div>
                    <input type="search" class="input" placeholder="🔍 Search">
                    <p class="selection-info">2 selected</p>
                    <div class="list">
                        <label class="list-item"><input type="checkbox" checked> Collection 1</label>
                        <label class="list-item"><input type="checkbox"> Collection 2</label>
                        <label class="list-item"><input type="checkbox" checked> Collection 3</label>
                    </div>
                    <div class="card-actions">
                        <button class="btn">Cancel</button>
                        <button class="btn btn-primary">Save</button>
                    </div>
                </section>
                <section class="card">
                    <div class="card-header">
                        <h2 class="card-title">Add products</h2>
                        <span class="arrow-icon up"></span>
                    </div>
                    <input type="search" class="input" placeholder="🔍 Search">
                    <div class="list">
                        <label class="list-item"><input type="checkbox" checked> Product 1</label>
                        <label class="list-item variant"><input type="checkbox" checked> Variant 1</label>
                        <label class="list-item variant"><input type="checkbox" checked> Variant 2</label>
                        <label class="list-item"><input type="checkbox" checked> Product 2</label>
                        <label class="list-item variant"><input type="checkbox" checked> Variant 1</label>
                    </div>
                    <div class="card-actions">
                        <button class="btn">Cancel</button>
                        <button class="btn btn-primary">Save</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
